{% extends "base.html" %}

{% block content %}
<h1>Archive</h1>
<p>Select a year:</p>

<ul>
    <li>
        <a href="{% url 'django_cs_archive:today' %}">Today</a>
    </li>
    <li>
        <a href="{% url 'django_cs_archive:this_week' %}">This week</a>
    </li>

    {% for year_date in date_list %}
        <li>
            <a href="{% url 'django_cs_archive:year' year=year_date|date:'Y' %}">
                {{ year_date|date:"Y" }}
            </a>
        </li>
    {% empty %}
        <li>No data in the archive.</li>
    {% endfor %}
</ul>
{% endblock %}
