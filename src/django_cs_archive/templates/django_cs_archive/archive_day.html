{% extends "base.html" %}
{% load i18n %}

{% block content %}
<style>
.archive-list ul {
    list-style-type: none;
    padding-left: 0;
}
.archive-list ul li {
    border-bottom: 1px solid #ccc;
    padding: 10px 0;
}
</style>
<div class="archive-day">
    <h1><a href="{% url 'django_cs_archive:index'%}" style="text-decoration: none;">{%trans 'Archive'%}</a></h1>

    <h2>{{ day|date:"F d, Y" }}</h2>

    <div class="archive-list">
        <ul>
            {% for object in object_list %}
                <li>
                    <a href="{{ object.get_absolute_url }}">{{ object }}</a>
                </li>
            {% empty %}
                <li>{% trans "No data for this day." %}</li>
            {% endfor %}
        </ul>
    </div>

    <div class="archive-nav">
        <a href="{% url 'django_cs_archive:month' year=day|date:'Y' month=day|date:'m' %}">{% trans "Monthly view" %}</a>
    </div>
</div>
{% endblock %}
