{% extends "base.html" %}

{% block content %}
<div class="archive-day">
    <h1>Today</h1>

    <div class="archive-list">
        <ul>
            {% for object in object_list %}
                <li>
                    <a href="{{ object.get_absolute_url }}">{{ object }}</a>
                </li>
            {% empty %}
                <li>No data for this day.</li>
            {% endfor %}
        </ul>
    </div>

    <div class="archive-nav">
        <a href="{% url 'django_cs_archive:index' %}">Archive</a>
    </div>
</div>
{% endblock %}
