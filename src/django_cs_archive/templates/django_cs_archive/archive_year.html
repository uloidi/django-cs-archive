{% extends "base.html" %}
{% load i18n %}
{% block content %}
    <h1>
        <a href="{% url 'django_cs_archive:index' %}"
           style="text-decoration: none">{% trans 'Archive' %}</a>
    </h1>
    <div class="archive-nav">
        <h2>
            <a href="{% url 'django_cs_archive:year' year=year|date:'Y' %}">{{ year|date:"Y" }}</a>
        </h2>
    </div>
    <ul class="month-list">
        <!-- date_list-ek HILABETEAK ditu hemen -->
        {% for month_date in date_list %}
            <li>
                <a href="{% url 'django_cs_archive:month' year=year|date:'Y' month=month_date|date:'m' %}">
                    {{ month_date|date:"F"|capfirst }} <!-- Urtarrila, Otsaila... -->
                </a>
            </li>
        {% empty %}
            <li>{% trans "No data this year." %}</li>
        {% endfor %}
    </ul>
{% endblock %}
